<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ede8de">
  <title>登录 · Scout</title>
  <style>
    :root { color-scheme: light; --ink:#202621; --soft:#737871; --moss:#315f4c; --dark:#244839; --paper:#f8f5ef; --line:#d8d3c8; --red:#a44736; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; }
    body { display:grid; place-items:center; overflow:hidden; padding:22px; color:var(--ink); background:#ede8de; font-family:Inter,"Noto Sans SC","PingFang SC",sans-serif; }
    body::before, body::after { content:""; position:fixed; border-radius:999px; filter:blur(2px); pointer-events:none; }
    body::before { width:52vw; height:52vw; left:-20vw; top:-25vw; background:rgba(49,95,76,.12); }
    body::after { width:36vw; height:36vw; right:-15vw; bottom:-18vw; background:rgba(164,71,54,.09); }
    main { position:relative; z-index:1; width:min(420px,100%); padding:38px 38px 32px; border:1px solid rgba(93,87,74,.18); border-radius:24px; background:rgba(248,245,239,.92); box-shadow:0 28px 80px rgba(48,44,34,.13); backdrop-filter:blur(18px); }
    .mark { width:48px; height:48px; display:grid; place-items:center; border-radius:15px; color:white; background:var(--moss); font:600 22px Georgia,serif; box-shadow:0 10px 24px rgba(49,95,76,.2); }
    .eyebrow { display:block; margin-top:27px; color:var(--red); font-size:11px; letter-spacing:.2em; }
    h1 { margin:8px 0 8px; font:600 32px/1.15 Georgia,"Noto Serif SC",serif; letter-spacing:-.03em; }
    .intro { margin:0 0 27px; color:var(--soft); font-size:13px; line-height:1.7; }
    label { display:block; margin-top:15px; }
    label span { display:block; margin:0 0 7px 2px; color:#5f645e; font-size:12px; }
    .field { position:relative; }
    input { width:100%; height:48px; padding:0 14px; border:1px solid var(--line); border-radius:12px; outline:none; color:var(--ink); background:#fff; font:500 14px inherit; transition:.18s; }
    input:focus { border-color:rgba(49,95,76,.65); box-shadow:0 0 0 4px rgba(49,95,76,.08); }
    .field input { padding-right:58px; }
    .reveal { position:absolute; right:7px; top:7px; height:34px; padding:0 10px; border:0; border-radius:8px; color:var(--soft); background:transparent; cursor:pointer; font-size:11px; }
    .reveal:hover { background:#f0ede7; }
    .submit { width:100%; height:48px; margin-top:24px; border:0; border-radius:12px; color:#fff; background:var(--moss); cursor:pointer; font-weight:700; letter-spacing:.04em; transition:.18s; }
    .submit:hover { background:var(--dark); transform:translateY(-1px); }
    .submit:disabled { opacity:.6; cursor:wait; transform:none; }
    .error { min-height:20px; margin:12px 2px 0; color:var(--red); font-size:12px; line-height:1.5; }
    footer { margin-top:25px; padding-top:18px; border-top:1px solid var(--line); color:#92958f; font-size:11px; }
    @media (max-width:520px) { main { padding:30px 24px 26px; border-radius:20px; } h1 { font-size:29px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark">S</div>
    <span class="eyebrow">PRIVATE READING SPACE</span>
    <h1>欢迎回来</h1>
    <p class="intro">登录后继续你的对话、书架与阅读记录。</p>
    <form id="login-form">
      <label><span>账号</span><input id="username" name="username" autocomplete="username" required autofocus></label>
      <label><span>密码</span><div class="field"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="reveal" type="button" id="reveal">显示</button></div></label>
      <button class="submit" id="submit" type="submit">进入 Scout</button>
      <div class="error" id="error" role="alert"></div>
    </form>
    <footer>此处只属于你的 Scout。登录状态保存在安全 Cookie 中。</footer>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const password = document.querySelector('#password');
    const reveal = document.querySelector('#reveal');
    const submit = document.querySelector('#submit');
    const error = document.querySelector('#error');
    const params = new URLSearchParams(location.search);
    const requested = params.get('next') || '/';
    const next = requested.startsWith('/') && !requested.startsWith('//') ? requested : '/';
    reveal.addEventListener('click', () => {
      const visible = password.type === 'text';
      password.type = visible ? 'password' : 'text';
      reveal.textContent = visible ? '显示' : '隐藏';
      password.focus();
    });
    form.addEventListener('submit', async event => {
      event.preventDefault(); error.textContent = ''; submit.disabled = true; submit.textContent = '正在登录…';
      try {
        const response = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username:document.querySelector('#username').value, password:password.value }) });
        if (!response.ok) { const data = await response.json().catch(() => ({})); throw new Error(data.detail || '登录失败'); }
        location.replace(next);
      } catch (reason) {
        error.textContent = reason.message; password.select(); submit.disabled = false; submit.textContent = '进入 Scout';
      }
    });
  </script>
</body>
</html>
